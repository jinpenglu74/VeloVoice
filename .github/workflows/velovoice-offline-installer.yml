name: VeloVoice 1.3.5 Offline Installer

on:
  push:
    branches:
      - offline-installer-1.3.5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout packaging source
        uses: actions/checkout@v4

      - name: Download and verify official payload, then build offline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = $env:GITHUB_WORKSPACE
          $delivery = Join-Path $root 'delivery'
          $runtimeUrl = 'https://github.com/Mai-Onsyn/VeloVoice/releases/download/1.3.5/VeloVoice-1.3.5-exe-with-jre.zip'
          $runtimeSize = 46019358L
          $runtimeSha = 'f88524ada6c8d17c0421d98814c2e72967e0cd09ec881a92fa59580c6e612657'
          $runtimeZip = Join-Path $env:RUNNER_TEMP 'VeloVoice-1.3.5-exe-with-jre.zip'
          $upstreamSourceZip = Join-Path $env:RUNNER_TEMP 'VeloVoice-1.3.5-source.zip'

          if (Test-Path -LiteralPath $delivery) { Remove-Item -LiteralPath $delivery -Recurse -Force }
          New-Item -ItemType Directory -Path $delivery -Force | Out-Null

          Write-Host 'Downloading official runtime payload on the build runner...'
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeZip -UseBasicParsing
          $runtime = Get-Item -LiteralPath $runtimeZip
          if ([long]$runtime.Length -ne $runtimeSize) { throw "Official runtime size mismatch: $($runtime.Length)" }
          $actualSha = (Get-FileHash -LiteralPath $runtimeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $runtimeSha) { throw "Official runtime SHA-256 mismatch: $actualSha" }

          Write-Host 'Downloading pinned upstream source archive...'
          Invoke-WebRequest -Uri 'https://github.com/Mai-Onsyn/VeloVoice/archive/refs/tags/1.3.5.zip' -OutFile $upstreamSourceZip -UseBasicParsing
          $sourceTest = Join-Path $env:RUNNER_TEMP 'upstream-source-check'
          if (Test-Path -LiteralPath $sourceTest) { Remove-Item -LiteralPath $sourceTest -Recurse -Force }
          Expand-Archive -LiteralPath $upstreamSourceZip -DestinationPath $sourceTest -Force
          if (-not (Get-ChildItem -LiteralPath $sourceTest -Filter 'pom.xml' -File -Recurse | Select-Object -First 1)) {
            throw 'Pinned upstream source archive is missing pom.xml.'
          }
          if (-not (Get-ChildItem -LiteralPath $sourceTest -Filter '*.java' -File -Recurse | Select-Object -First 1)) {
            throw 'Pinned upstream source archive contains no Java source files.'
          }

          $payloadStage = Join-Path $env:RUNNER_TEMP 'velovoice-payload-stage'
          if (Test-Path -LiteralPath $payloadStage) { Remove-Item -LiteralPath $payloadStage -Recurse -Force }
          New-Item -ItemType Directory -Path $payloadStage -Force | Out-Null
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath $payloadStage -Force
          $appExe = Get-ChildItem -LiteralPath $payloadStage -Filter 'VeloVoice.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $appExe) { throw 'Official runtime archive does not contain VeloVoice.exe.' }
          $appRoot = $appExe.Directory.FullName
          $javaExe = Get-ChildItem -LiteralPath $appRoot -Filter 'java.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $javaExe) { throw 'Official runtime archive does not contain bundled java.exe.' }

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 6 compiler was not found after installation.' }

          $iss = Join-Path $root 'offline-installer\VeloVoice-1.3.5-Offline.iss'
          $license = Join-Path $root 'LICENSE'
          & $iscc "/DSourceDir=$appRoot" "/DLicenseFilePath=$license" "/O$delivery" $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed with exit code $LASTEXITCODE" }

          $installer = Join-Path $delivery 'VeloVoice-1.3.5-Offline-Setup-x64.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Installer EXE was not created.' }
          if ((Get-Item -LiteralPath $installer).Length -lt 40000000) {
            throw 'Installer is unexpectedly small; runtime payload may not be embedded.'
          }

          Write-Host 'Running silent install smoke test...'
          $testInstall = Join-Path $env:RUNNER_TEMP 'VeloVoice-Offline-Install-Smoke'
          if (Test-Path -LiteralPath $testInstall) { Remove-Item -LiteralPath $testInstall -Recurse -Force }
          $proc = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$testInstall") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent install smoke test failed with exit code $($proc.ExitCode)" }
          $installedExe = Join-Path $testInstall 'VeloVoice.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) {
            $installedExe = Get-ChildItem -LiteralPath $testInstall -Filter 'VeloVoice.exe' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $installedExe -or -not (Test-Path -LiteralPath $installedExe)) { throw 'Silent install did not place VeloVoice.exe.' }
          $installedJava = Get-ChildItem -LiteralPath $testInstall -Filter 'java.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $installedJava) { throw 'Silent install did not place the bundled Java runtime.' }
          Write-Host 'SILENT_INSTALL_SMOKE_TEST=PASS'
          Write-Host "INSTALLED_EXE=$installedExe"
          Write-Host "BUNDLED_JAVA=$($installedJava.FullName)"
          $uninstaller = Get-ChildItem -LiteralPath $testInstall -Filter 'unins*.exe' -File | Select-Object -First 1
          if ($null -ne $uninstaller) {
            Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
          }
          Remove-Item -LiteralPath $testInstall -Recurse -Force -ErrorAction SilentlyContinue

          $sourceBundle = Join-Path $delivery 'VeloVoice_1.3.5_Offline_Source'
          New-Item -ItemType Directory -Path (Join-Path $sourceBundle 'payload') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $sourceBundle 'upstream-source') -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $root 'offline-installer\VeloVoice-1.3.5-Offline.iss') -Destination $sourceBundle
          Copy-Item -LiteralPath (Join-Path $root 'offline-installer\build_offline.ps1') -Destination $sourceBundle
          Copy-Item -LiteralPath (Join-Path $root 'offline-installer\README.md') -Destination $sourceBundle
          Copy-Item -LiteralPath $license -Destination (Join-Path $sourceBundle 'LICENSE-GPL-3.0.txt')
          Copy-Item -LiteralPath $runtimeZip -Destination (Join-Path $sourceBundle 'payload\VeloVoice-1.3.5-exe-with-jre.zip')
          Copy-Item -LiteralPath $upstreamSourceZip -Destination (Join-Path $sourceBundle 'upstream-source\VeloVoice-1.3.5-source.zip')

          $sourceZip = Join-Path $delivery 'VeloVoice_1.3.5_Offline_Source.zip'
          Compress-Archive -Path (Join-Path $sourceBundle '*') -DestinationPath $sourceZip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $sourceZip)) { throw 'Offline source package ZIP was not created.' }

          $sumLines = @()
          foreach ($file in @($installer, $sourceZip, $runtimeZip, $upstreamSourceZip)) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $sumLines += "$hash  $(Split-Path -Leaf $file)"
          }
          $sumLines | Set-Content -LiteralPath (Join-Path $delivery 'SHA256SUMS.txt') -Encoding ASCII

          @"
          VeloVoice 1.3.5 Offline Installer Build Report
          Result: PASS
          Official runtime size: $($runtime.Length)
          Official runtime SHA-256: $actualSha
          Installer size: $((Get-Item -LiteralPath $installer).Length)
          Offline source ZIP size: $((Get-Item -LiteralPath $sourceZip).Length)
          Silent installation smoke test: PASS
          Installed VeloVoice.exe: $installedExe
          Bundled Java found: YES
          Installer downloads during install: NO (payload embedded by Inno Setup)
          Note: TTS engines that use remote services may still require internet at runtime.
          "@ | Set-Content -LiteralPath (Join-Path $delivery 'BUILD_REPORT.txt') -Encoding UTF8

      - name: Upload offline installer and full source bundle
        uses: actions/upload-artifact@v4
        with:
          name: velovoice-1.3.5-offline-delivery
          path: delivery/*
          if-no-files-found: error
          retention-days: 30